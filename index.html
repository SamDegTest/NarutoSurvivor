<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NarutoSurvivor — Fan Game</title>
  <meta name="description" content="Fan-made horde survival browser game set in the Naruto universe. Survive endless waves of Zetsu and rogue ninja. Free & non-profit." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:title" content="NarutoSurvivor — Fan Game" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050906;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }

    #app {
      position: relative;
      box-shadow: 0 0 80px rgba(251, 191, 36, 0.15), 0 0 40px rgba(0,0,0,0.8);
      border-radius: 4px;
      overflow: hidden;
    }

    #app canvas {
      display: block;
    }

    /* Loading indicator (shown before Pixi mounts) */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050906;
      color: #FBF;
      font-size: 18px;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    #loading.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(251,191,36,0.2);
      border-top-color: #FBBf24;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Caricamento Chakra in corso…</span>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Hide loading screen once canvas appears
    const app = document.getElementById('app');
    const loading = document.getElementById('loading');
    const observer = new MutationObserver(() => {
      if (app.querySelector('canvas')) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 600);
        observer.disconnect();
      }
    });
    observer.observe(app, { childList: true });
  </script>
</body>
</html>
