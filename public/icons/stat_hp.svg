<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="healBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="healGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#healGlow)"/>
  <circle cx="50" cy="50" r="43" fill="url(#healBg)" stroke="#059669" stroke-width="1.5"/>

  <!-- Medical Chakra Heart -->
  <path d="M50 78 C25 60 18 42 24 30 C30 18 44 20 50 32 C56 20 70 18 76 30 C82 42 75 60 50 78 Z" fill="url(#heartGrad)" stroke="#34d399" stroke-width="2.5" filter="url(#healGlow)"/>

  <!-- Glowing Cross in Center -->
  <rect x="47" y="36" width="6" height="20" rx="3" fill="#ecfdf5"/>
  <rect x="40" y="43" width="20" height="6" rx="3" fill="#ecfdf5"/>
</svg>
