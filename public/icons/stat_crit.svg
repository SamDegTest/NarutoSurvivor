<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="critBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180404"/>
    </radialGradient>
    <filter id="sharinganGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#ef4444" stroke-width="3" filter="url(#sharinganGlow)"/>
  <circle cx="50" cy="50" r="43" fill="url(#critBg)" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- Crimson Sharingan Eye Pupil -->
  <circle cx="50" cy="50" r="28" fill="#dc2626" stroke="#991b1b" stroke-width="2" filter="url(#sharinganGlow)"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- Central Pupil dot -->
  <circle cx="50" cy="50" r="6" fill="#0f172a"/>

  <!-- 3 Tomoe Marks -->
  <!-- Tomoe 1 (top) -->
  <g transform="translate(50, 50) rotate(0) translate(-50, -50)">
    <circle cx="50" cy="34" r="3.5" fill="#0f172a"/>
    <path d="M50 34 C47 31 52 26 55 28 C54 31 52 34 50 34 Z" fill="#0f172a"/>
  </g>
  <!-- Tomoe 2 (bottom right) -->
  <g transform="translate(50, 50) rotate(120) translate(-50, -50)">
    <circle cx="50" cy="34" r="3.5" fill="#0f172a"/>
    <path d="M50 34 C47 31 52 26 55 28 C54 31 52 34 50 34 Z" fill="#0f172a"/>
  </g>
  <!-- Tomoe 3 (bottom left) -->
  <g transform="translate(50, 50) rotate(240) translate(-50, -50)">
    <circle cx="50" cy="34" r="3.5" fill="#0f172a"/>
    <path d="M50 34 C47 31 52 26 55 28 C54 31 52 34 50 34 Z" fill="#0f172a"/>
  </g>
</svg>
