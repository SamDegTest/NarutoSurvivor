<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="magBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <filter id="elecGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Badge -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#06b6d4" stroke-width="3" filter="url(#elecGlow)"/>
  <circle cx="50" cy="50" r="43" fill="url(#magBg)" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Horseshoe Ninja Magnet -->
  <path d="M30 65 L30 40 A20 20 0 0 1 70 40 L70 65 L58 65 L58 40 A8 8 0 0 0 42 40 L42 65 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <!-- Magnet Poles (Red and Silver) -->
  <rect x="29" y="52" width="14" height="14" rx="2" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="57" y="52" width="14" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Electric Lightning Arcs -->
  <path d="M22 45 L15 52 L24 55 L16 68" stroke="#38bdf8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M78 45 L85 52 L76 55 L84 68" stroke="#38bdf8" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Center Chakra Attraction Pulse -->
  <circle cx="50" cy="40" r="4" fill="#67e8f9" filter="url(#elecGlow)"/>
  <circle cx="50" cy="40" r="12" fill="none" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5"/>
</svg>
