<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="defBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#94a3b8" stroke-width="3" filter="url(#shieldGlow)"/>
  <circle cx="50" cy="50" r="43" fill="url(#defBg)" stroke="#64748b" stroke-width="1.5"/>

  <!-- Ninja Steel & Sand Shield -->
  <path d="M50 20 L76 28 C76 56 50 78 50 78 C50 78 24 56 24 28 Z" fill="#475569" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shieldGlow)"/>
