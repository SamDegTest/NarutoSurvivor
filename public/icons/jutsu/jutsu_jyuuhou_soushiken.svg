<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="lionBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
    <filter id="lionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#090514" stroke="#818cf8" stroke-width="2.5" filter="url(#lionGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#lionBg)"/>

  <!-- Left Ethereal Lion Head -->
  <path d="M36 32 C30 22 18 26 18 36 C18 48 30 54 36 62 C40 54 44 46 36 32 Z" fill="#6366f1" opacity="0.85" filter="url(#lionGlow)"/>
  <circle cx="28" cy="38" r="2.5" fill="#fef08a"/>
  <!-- Left Fangs -->
  <polygon points="26,44 30,52 34,46" fill="#ffffff"/>

  <!-- Right Ethereal Lion Head -->
  <path d="M64 32 C70 22 82 26 82 36 C82 48 70 54 64 62 C60 54 56 46 64 32 Z" fill="#6366f1" opacity="0.85" filter="url(#lionGlow)"/>
  <circle cx="72" cy="38" r="2.5" fill="#fef08a"/>
  <!-- Right Fangs -->
  <polygon points="74,44 70,52 66,46" fill="#ffffff"/>

  <!-- Flowing Indigo Chakra Manes enveloping the fists -->
  <path d="M50 78 C36 78 28 66 32 54 C38 62 44 68 50 68 C56 68 62 62 68 54 C72 66 64 78 50 78 Z" fill="#4f46e5" filter="url(#lionGlow)"/>

  <!-- Twin Clenched Gentle Fist Cores -->
  <circle cx="34" cy="52" r="8" fill="#c7d2fe" stroke="#ffffff" stroke-width="1.5" filter="url(#lionGlow)"/>
  <circle cx="66" cy="52" r="8" fill="#c7d2fe" stroke="#ffffff" stroke-width="1.5" filter="url(#lionGlow)"/>

  <!-- Radiating Byakugan Violet Chakra Ribbons -->
  <path d="M34 52 Q50 40 66 52" fill="none" stroke="#e0e7ff" stroke-width="2"/>
</svg>