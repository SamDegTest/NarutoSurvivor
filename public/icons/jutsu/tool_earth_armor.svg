<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="toolArmorBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <filter id="armorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0c0a09" stroke="#a8a29e" stroke-width="2.5" filter="url(#armorGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#toolArmorBg)"/>

  <!-- Hardened Stone Samurai Shield & Vambrace -->
  <polygon points="50,18 78,28 72,66 50,84 28,66 22,28" fill="#78716c" stroke="#d6d3d1" stroke-width="2.5" filter="url(#armorGlow)"/>
  <!-- Crystalline Facets -->
  <polygon points="50,22 72,30 68,62 50,78 32,62 28,30" fill="#57534e"/>
  <polygon points="50,28 64,36 50,72 36,36" fill="#a8a29e" opacity="0.6"/>

  <!-- Golden Doton Kanji / Rune Inscription -->
  <circle cx="50" cy="46" r="8" fill="#ca8a04" stroke="#fef08a" stroke-width="1.5"/>
  <line x1="50" y1="42" x2="50" y2="50" stroke="#ffffff" stroke-width="1.8"/>
  <line x1="46" y1="46" x2="54" y2="46" stroke="#ffffff" stroke-width="1.8"/>
</svg>