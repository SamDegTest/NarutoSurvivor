  <!-- Piercing Celestial Eyes -->
  <circle cx="44" cy="40" r="3" fill="#fef08a" filter="url(#kirinGlow)"/>
  <circle cx="56" cy="40" r="3" fill="#fef08a" filter="url(#kirinGlow)"/>

  <!-- Roaring Strike Lightning Strikes downwards -->
  <path d="M50 72 L46 82 L54 86 L50 96" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" filter="url(#kirinGlow)"/>
  <path d="M42 66 L30 84 L38 88 L26 96" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 66 L70 84 L62 88 L74 96" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
