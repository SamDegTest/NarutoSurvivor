<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="earthBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <filter id="earthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0c0a09" stroke="#a8a29e" stroke-width="2.5" filter="url(#earthGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#earthBg)"/>

  <!-- Rising Fissured Bedrock Ground -->
  <path d="M12 78 L28 72 L46 76 L66 70 L88 78 L88 88 L12 88 Z" fill="#44403c"/>

  <!-- Giant Stone Rampart Wall -->
  <path d="M20 74 L20 36 L30 36 L30 32 L44 32 L44 36 L56 36 L56 32 L70 32 L70 36 L80 36 L80 74 Z" fill="#78716c" stroke="#d6d3d1" stroke-width="2"/>

  <!-- Stone Brick Seams -->
  <line x1="20" y1="48" x2="80" y2="48" stroke="#57534e" stroke-width="1.8"/>
  <line x1="20" y1="60" x2="80" y2="60" stroke="#57534e" stroke-width="1.8"/>
  <line x1="40" y1="36" x2="40" y2="48" stroke="#57534e" stroke-width="1.5"/>
  <line x1="60" y1="36" x2="60" y2="48" stroke="#57534e" stroke-width="1.5"/>
  <line x1="30" y1="48" x2="30" y2="60" stroke="#57534e" stroke-width="1.5"/>
  <line x1="50" y1="48" x2="50" y2="60" stroke="#57534e" stroke-width="1.5"/>
  <line x1="70" y1="48" x2="70" y2="60" stroke="#57534e" stroke-width="1.5"/>

  <!-- Kakashi's Sculpted Stone Dog Heads on Wall -->
  <!-- Left Dog -->
  <path d="M30 40 L34 44 L38 40 L38 46 L34 48 L30 46 Z" fill="#d6d3d1"/>
  <circle cx="32" cy="43" r="1" fill="#000000"/>
  <circle cx="36" cy="43" r="1" fill="#000000"/>
  <!-- Center/Right Dog -->
  <path d="M62 40 L66 44 L70 40 L70 46 L66 48 L62 46 Z" fill="#d6d3d1"/>
  <circle cx="64" cy="43" r="1" fill="#000000"/>
  <circle cx="68" cy="43" r="1" fill="#000000"/>

  <!-- Earth Cracks & Flying Rocks -->
  <path d="M34 76 L30 84 M62 74 L68 84" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="16,32 20,26 24,30 20,36" fill="#a8a29e"/>
  <polygon points="78,28 84,22 88,26 82,32" fill="#a8a29e"/>
</svg>