<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="oodamaCore" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="oodamaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with Heavy Aura -->
  <circle cx="50" cy="50" r="48" fill="#030712" stroke="#0284c7" stroke-width="2.5" filter="url(#oodamaGlow)"/>

  <!-- Colossal Chakra Prominence Corona -->
  <circle cx="50" cy="50" r="44" fill="#0284c7" opacity="0.4" filter="url(#oodamaGlow)"/>
  <circle cx="50" cy="50" r="38" fill="url(#oodamaCore)" filter="url(#oodamaGlow)"/>

  <!-- Violent Giant Swirling Currents -->
  <path d="M50 14 C74 14 86 32 86 50 C86 68 68 84 48 84 C28 84 14 68 14 50 C14 36 26 24 40 24 C52 24 60 32 60 44 C60 52 54 58 46 58 C40 58 36 54 36 48" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M50 86 C26 86 14 68 14 50 C14 32 32 16 52 16 C72 16 86 32 86 50 C86 64 74 76 60 76 C48 76 40 68 40 56 C40 48 46 42 54 42" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Multi-layered High Tension Shock Orbitals -->
  <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" transform="rotate(-25 50 50)"/>
  <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.75" transform="rotate(45 50 50)"/>

  <!-- Radiant Core -->
  <circle cx="50" cy="50" r="14" fill="#ffffff" filter="url(#oodamaGlow)"/>
