<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="toadBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#140501"/>
    </radialGradient>
    <filter id="toadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#140501" stroke="#ea580c" stroke-width="2.5" filter="url(#toadGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#toadBg)"/>

  <!-- Thick Jet of Burning Golden-Amber Toad Oil -->
  <path d="M18 64 C28 64 34 52 48 50 C62 48 70 36 84 34 L82 46 C68 48 60 60 46 62 C32 64 26 74 16 72 Z" fill="#d97706" filter="url(#toadGlow)"/>

  <!-- Blazing Raging Flames Engulfing the Oil Stream -->
  <path d="M22 60 Q34 40 48 46 Q60 30 74 38 Q88 20 86 42 Q72 58 56 56 Q38 68 22 60 Z" fill="#ef4444" opacity="0.85" filter="url(#toadGlow)"/>
  <path d="M30 56 Q42 42 54 48 Q64 36 76 44 Q66 54 52 52 Q40 60 30 56 Z" fill="#fbbf24"/>

  <!-- Gamabunta's Wooden Pipe Accent (Top Right) -->
  <path d="M68 22 L82 16 L84 22 L72 26 Z" fill="#78350f" stroke="#d97706" stroke-width="1"/>
  <ellipse cx="84" cy="19" rx="3" ry="5" fill="#451a03"/>

  <!-- Burning Oil Globules & Splashes -->
  <circle cx="38" cy="34" r="3" fill="#fef08a"/>
  <circle cx="58" cy="28" r="2.5" fill="#f97316"/>
  <circle cx="78" cy="56" r="3" fill="#ef4444"/>
  <circle cx="28" cy="74" r="2.2" fill="#d97706"/>
</svg>