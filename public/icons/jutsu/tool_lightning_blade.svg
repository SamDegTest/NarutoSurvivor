<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="toolBladeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="bladeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#020617" stroke="#60a5fa" stroke-width="2.5" filter="url(#bladeGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#toolBladeBg)"/>

  <!-- Ninja Chokuto Katana Blade -->
  <line x1="20" y1="80" x2="78" y2="22" stroke="#e2e8f0" stroke-width="5" stroke-linecap="square"/>
  <line x1="21" y1="79" x2="77" y2="23" stroke="#ffffff" stroke-width="2.2" stroke-linecap="square"/>
  
  <!-- Hilt & Tsuba (Guard) -->
  <rect x="24" y="68" width="12" height="14" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" transform="rotate(45 30 75)"/>
  <line x1="28" y1="73" x2="36" y2="65" stroke="#facc15" stroke-width="2.5"/>

  <!-- Crackling Lightning Arcs Along The Edge -->
  <path d="M36 64 L46 48 L42 46 L58 36 L52 32 L72 24" fill="none" stroke="#60a5fa" stroke-width="2.8" stroke-linecap="round" filter="url(#bladeGlow)"/>
  <path d="M36 64 L46 48 L42 46 L58 36 L52 32 L72 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Spark Explosions -->
  <circle cx="78" cy="22" r="3" fill="#ffffff" filter="url(#bladeGlow)"/>
  <circle cx="48" cy="46" r="2" fill="#93c5fd"/>
</svg>