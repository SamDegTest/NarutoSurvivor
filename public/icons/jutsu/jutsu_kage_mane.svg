<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="kageBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="kageGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#64748b" stroke-width="2.5" filter="url(#kageGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#kageBg)"/>

  <!-- Shikamaru's Finger Circle Meditation Seal -->
  <circle cx="50" cy="30" r="14" fill="none" stroke="#475569" stroke-width="2.5"/>
  <circle cx="50" cy="30" r="8" fill="#000000" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Extending Pitch Black Shadow Tendril creeping across the ground -->
  <path d="M50 44 L50 56 Q44 64 48 72 Q52 80 50 88" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <path d="M50 44 L50 56 Q44 64 48 72 Q52 80 50 88" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Branching Shadow Arms seeking Enemy Footstep -->
  <path d="M48 64 Q32 68 20 76" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <path d="M48 64 Q32 68 20 76" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>

  <path d="M50 72 Q66 74 80 78" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <path d="M50 72 Q66 74 80 78" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Target Ensnared Nodes (Shadow Lock Aura) -->
  <circle cx="20" cy="76" r="4" fill="#a855f7" filter="url(#kageGlow)"/>
  <circle cx="80" cy="78" r="4" fill="#a855f7" filter="url(#kageGlow)"/>
  <circle cx="50" cy="88" r="5" fill="#a855f7" filter="url(#kageGlow)"/>
</svg>