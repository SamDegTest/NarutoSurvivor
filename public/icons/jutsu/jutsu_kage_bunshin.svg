<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bunshinBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b1d08"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </radialGradient>
    <filter id="bunshinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#030712" stroke="#f59e0b" stroke-width="2.5" filter="url(#bunshinGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#bunshinBg)"/>

  <!-- Left & Right Clone Silhouettes -->
  <path d="M22 68 C22 54 29 44 38 42 C38 36 34 32 34 26 C34 20 39 16 43 16 C45 20 44 26 44 28 C48 30 50 35 50 42 C44 44 38 52 38 68 Z" fill="#b45309" opacity="0.45"/>
  <path d="M78 68 C78 54 71 44 62 42 C62 36 66 32 66 26 C66 20 61 16 57 16 C55 20 56 26 56 28 C52 30 50 35 50 42 C56 44 62 52 62 68 Z" fill="#b45309" opacity="0.45"/>

  <!-- Billowing Smoke Poofs (Clone Summoning Cloud) -->
  <path d="M24 72 C16 72 12 65 15 58 C12 52 17 44 24 46 C27 38 38 36 44 42 C48 36 58 36 62 42 C68 38 78 44 76 52 C84 56 82 66 76 72 C74 78 66 82 58 80 C52 84 42 84 36 80 C30 82 24 78 24 72 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.8" opacity="0.95" filter="url(#bunshinGlow)"/>
  <path d="M30 65 Q36 58 44 64" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 62 Q60 56 68 64" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Iconic Cross-Finger Hand Seal (Juuji-in ✚) -->
  <!-- Left hand finger pointing up -->
  <rect x="46" y="24" width="8" height="38" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" filter="url(#bunshinGlow)"/>
  <!-- Right hand finger crossed horizontally -->
  <rect x="31" y="38" width="38" height="8" rx="4" fill="#fde047" stroke="#d97706" stroke-width="1.5" filter="url(#bunshinGlow)"/>
  <!-- Knuckle Bandage/Joint detail -->
  <line x1="50" y1="38" x2="50" y2="46" stroke="#b45309" stroke-width="2"/>
  <circle cx="50" cy="42" r="5" fill="#ffffff" opacity="0.9"/>

  <!-- Action Speed Flares -->
  <line x1="16" y1="28" x2="26" y2="34" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="28" x2="74" y2="34" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
</svg>