<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="senbonBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="senbonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#020617" stroke="#94a3b8" stroke-width="2.5" filter="url(#senbonGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#senbonBg)"/>

  <!-- Jiraiya Wild White Sage Hair Mane at Top -->
  <path d="M16 28 Q28 14 42 22 Q50 12 58 22 Q72 14 84 28 Q78 36 66 32 Q50 40 34 32 Q22 36 16 28 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Barrage of Hardened Hair Senbon Needles (Fired Downward/Forward) -->
  <line x1="26" y1="36" x2="16" y2="76" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" filter="url(#senbonGlow)"/>
  <line x1="36" y1="38" x2="30" y2="84" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" filter="url(#senbonGlow)"/>
  <line x1="46" y1="40" x2="44" y2="88" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#senbonGlow)"/>
  <line x1="56" y1="40" x2="58" y2="88" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#senbonGlow)"/>
  <line x1="66" y1="38" x2="72" y2="84" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" filter="url(#senbonGlow)"/>
  <line x1="76" y1="36" x2="86" y2="76" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" filter="url(#senbonGlow)"/>

  <!-- Metallic Silver Gleams on Senbon Tips -->
  <polygon points="16,76 17,70 14,73" fill="#38bdf8"/>
  <polygon points="30,84 31,78 28,81" fill="#38bdf8"/>
  <polygon points="44,88 45,82 42,85" fill="#38bdf8"/>
  <polygon points="58,88 57,82 60,85" fill="#38bdf8"/>
  <polygon points="72,84 71,78 74,81" fill="#38bdf8"/>
  <polygon points="86,76 85,70 88,73" fill="#38bdf8"/>

  <!-- Speed Lines -->
  <line x1="50" y1="42" x2="50" y2="60" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
</svg>