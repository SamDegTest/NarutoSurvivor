<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="shurikenCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shuriGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#04121d" stroke="#67e8f9" stroke-width="2.5" filter="url(#shuriGlow)"/>

  <!-- High-Frequency Screaming Sound Waves Rings -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#bae6fd" stroke-width="1" stroke-dasharray="4,3" opacity="0.8"/>

  <!-- Four Aerodynamic Giant Wind Scythe Blades -->
  <!-- Top Blade -->
  <path d="M50 50 C48 35 42 22 50 8 C58 22 66 32 50 50 Z" fill="url(#bladeGrad)" stroke="#ffffff" stroke-width="1.2" filter="url(#shuriGlow)"/>
  <!-- Bottom Blade -->
  <path d="M50 50 C52 65 58 78 50 92 C42 78 34 68 50 50 Z" fill="url(#bladeGrad)" stroke="#ffffff" stroke-width="1.2" filter="url(#shuriGlow)"/>
  <!-- Right Blade -->
  <path d="M50 50 C65 48 78 42 92 50 C78 58 68 66 50 50 Z" fill="url(#bladeGrad)" stroke="#ffffff" stroke-width="1.2" filter="url(#shuriGlow)"/>
  <!-- Left Blade -->
  <path d="M50 50 C35 52 22 58 8 50 C22 42 32 34 50 50 Z" fill="url(#bladeGrad)" stroke="#ffffff" stroke-width="1.2" filter="url(#shuriGlow)"/>

  <!-- Angled Scythe Blade Wings (Vortex Curve) -->
  <path d="M50 50 Q66 22 84 20 Q66 40 50 50" fill="#a5f3fc" opacity="0.85"/>
  <path d="M50 50 Q78 66 80 84 Q60 66 50 50" fill="#a5f3fc" opacity="0.85"/>
  <path d="M50 50 Q34 78 16 80 Q34 60 50 50" fill="#a5f3fc" opacity="0.85"/>
  <path d="M50 50 Q22 34 20 16 Q40 34 50 50" fill="#a5f3fc" opacity="0.85"/>

  <!-- Central Superdense Rasengan Sphere -->
  <circle cx="50" cy="50" r="16" fill="url(#shurikenCore)" stroke="#ffffff" stroke-width="2" filter="url(#shuriGlow)"/>
  <circle cx="50" cy="50" r="6" fill="#ffffff"/>
</svg>