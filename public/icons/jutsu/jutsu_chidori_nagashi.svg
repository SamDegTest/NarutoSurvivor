<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="nagashiBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="nagashiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#020617" stroke="#38bdf8" stroke-width="2.5" filter="url(#nagashiGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#nagashiBg)"/>

  <!-- Concentric Omni-directional Shockwave Shields -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-dasharray="8,4" opacity="0.6"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,3" opacity="0.8"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#93c5fd" stroke-width="2.5" opacity="0.9"/>

  <!-- 360 Radial Lightning Discharge Blades -->
  <!-- Top & Bottom -->
  <path d="M50 35 L46 22 L54 18 L50 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#nagashiGlow)"/>
  <path d="M50 65 L54 78 L46 82 L50 92" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#nagashiGlow)"/>
  <!-- Left & Right -->
  <path d="M35 50 L22 46 L18 54 L8 50" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#nagashiGlow)"/>
  <path d="M65 50 L78 54 L82 46 L92 50" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" filter="url(#nagashiGlow)"/>
  <!-- Diagonals -->
  <path d="M39 39 L26 28 L32 24 L18 16" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M61 61 L74 72 L68 76 L82 84" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M61 39 L74 28 L68 24 L82 16" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M39 61 L26 72 L32 76 L18 84" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Center Full Body Lightning Discharge Core -->
  <circle cx="50" cy="50" r="14" fill="#67e8f9" opacity="0.6" filter="url(#nagashiGlow)"/>
  <circle cx="50" cy="50" r="8" fill="#ffffff" filter="url(#nagashiGlow)"/>
</svg>