  <ellipse cx="50" cy="50" rx="40" ry="22" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.6" transform="rotate(25 50 50)"/>
  <ellipse cx="50" cy="50" rx="38" ry="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" transform="rotate(-35 50 50)"/>
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" transform="rotate(75 50 50)"/>

  <!-- High-Density Chakra Sphere -->
  <circle cx="50" cy="50" r="28" fill="url(#rasenCore)" filter="url(#glowRasen)"/>

  <!-- High-Speed Vortex Spiral Streams -->
  <path d="M50 22 C65 22 78 35 78 50 C78 62 68 72 56 72 C46 72 38 64 38 54 C38 46 44 40 52 40 C57 40 61 44 61 49 C61 52 59 55 56 55 C53 55 51 53 51 50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <path d="M50 78 C35 78 22 65 22 50 C22 38 32 28 44 28 C54 28 62 36 62 46 C62 54 56 60 48 60 C43 60 39 56 39 51 C39 48 41 45 44 45 C47 45 49 47 49 50" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

