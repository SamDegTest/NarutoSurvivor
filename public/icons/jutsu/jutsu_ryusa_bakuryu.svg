<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="tsunamiBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </radialGradient>
    <filter id="tsunamiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#1c0a00" stroke="#f59e0b" stroke-width="2.5" filter="url(#tsunamiGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#tsunamiBg)"/>

  <!-- Colossal Cresting Sand Wave (Tsunami) -->
  <path d="M12 78 C20 48 36 28 60 22 C78 18 88 28 84 40 C80 34 74 32 66 34 C50 38 38 52 30 78 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="2" filter="url(#tsunamiGlow)"/>
