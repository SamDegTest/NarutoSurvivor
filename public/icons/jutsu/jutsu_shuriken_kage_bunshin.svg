<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="shurikenBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shuriCloneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#020617" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shuriCloneGlow)"/>
  <circle cx="50" cy="50" r="44" fill="url(#shurikenBg)"/>

  <!-- Shadow Clone Smoke Puffs -->
  <circle cx="26" cy="32" r="10" fill="#f1f5f9" opacity="0.6"/>
  <circle cx="74" cy="32" r="10" fill="#f1f5f9" opacity="0.6"/>
  <circle cx="50" cy="74" r="12" fill="#f1f5f9" opacity="0.6"/>

  <!-- Secondary Cloned Shuriken (Top Left & Top Right) -->
  <g transform="translate(24, 30) scale(0.45)">
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#0f172a"/>
  </g>
  <g transform="translate(74, 30) scale(0.45)">
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#0f172a"/>
  </g>
  <g transform="translate(26, 68) scale(0.45)">
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#0f172a"/>
  </g>
  <g transform="translate(74, 68) scale(0.45)">
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#0f172a"/>
  </g>

  <!-- Giant Primary Center Shuriken -->
  <polygon points="50,16 57,43 84,50 57,57 50,84 43,57 16,50 43,43" fill="#334155" stroke="#ffffff" stroke-width="2.5" filter="url(#shuriCloneGlow)"/>
  <!-- Bevel Edges -->
  <line x1="50" y1="16" x2="50" y2="84" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="16" y1="50" x2="84" y2="50" stroke="#94a3b8" stroke-width="1.8"/>
  <!-- Center Finger Ring -->
  <circle cx="50" cy="50" r="8" fill="#020617" stroke="#ffffff" stroke-width="2"/>
</svg>