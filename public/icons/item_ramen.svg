<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bowlBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b1d11"/>
      <stop offset="100%" stop-color="#180b06"/>
    </radialGradient>
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Border Emblem Ring -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#f59e0b" stroke-width="3" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="43" fill="url(#bowlBg)" stroke="#d97706" stroke-width="1.5"/>
  
  <!-- Steam Whisps -->
  <path d="M40 28 Q42 20 38 15" stroke="#fef3c7" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M50 25 Q53 18 48 12" stroke="#fef3c7" stroke-width="2.5" fill="none" opacity="0.75" stroke-linecap="round"/>
  <path d="M60 28 Q63 21 59 16" stroke="#fef3c7" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Ramen Bowl -->
  <path d="M22 45 Q50 48 78 45 Q75 75 50 78 Q25 75 22 45 Z" fill="#b91c1c" stroke="#fef08a" stroke-width="2"/>
  <ellipse cx="50" cy="45" rx="28" ry="10" fill="url(#soupGrad)" stroke="#fef08a" stroke-width="1.5"/>
  <path d="M22 47 Q50 50 78 47" stroke="#fef08a" stroke-width="2" fill="none"/>
  <circle cx="50" cy="62" r="6" fill="#7f1d1d"/>

  <!-- Noodles -->
  <path d="M30 44 Q38 41 46 45 Q54 42 62 45" stroke="#fef08a" stroke-width="2" fill="none"/>
  <path d="M34 46 Q42 43 50 47 Q58 44 66 47" stroke="#fef08a" stroke-width="1.8" fill="none"/>

  <!-- Narutomaki (Spiral Fish Cake) -->
  <circle cx="42" cy="44" r="7" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
  <path d="M42 41 A3 3 0 0 1 45 44 A3 3 0 0 1 42 47 A1.5 1.5 0 0 1 40.5 44" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Boiled Egg -->
  <ellipse cx="58" cy="45" rx="6" ry="5" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="58" cy="45" r="3" fill="#ea580c"/>

  <!-- Chopsticks -->
  <line x1="20" y1="36" x2="80" y2="40" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="40" x2="78" y2="43" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>
</svg>
