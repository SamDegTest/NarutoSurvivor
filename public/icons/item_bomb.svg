<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="blastBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#180404"/>
    </radialGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Badge -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#ef4444" stroke-width="3" filter="url(#flameGlow)"/>
  <circle cx="50" cy="50" r="43" fill="url(#blastBg)" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- Paper Tag (Rotated Kibaku Fuda) -->
  <g transform="translate(50, 50) rotate(-12) translate(-25, -35)">
    <!-- Parchment paper -->
    <rect x="0" y="0" width="50" height="70" rx="4" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
    <!-- Burnt edges -->
    <path d="M0 0 L15 0 L18 4 L30 1 L42 5 L50 0 L50 70 L38 68 L25 70 L10 67 L0 70 Z" fill="#fde047" opacity="0.4"/>
    
    <!-- Red explosion circle in center -->
    <circle cx="25" cy="35" r="16" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="25" cy="35" r="13" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>

    <!-- Kanji Symbol for "Baku" (Explosion / 爆) -->
    <text x="25" y="42" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-weight="900" font-size="20" fill="#dc2626" text-anchor="middle">爆</text>

    <!-- Sealing runes -->
    <circle cx="25" cy="14" r="3" fill="#dc2626"/>
    <line x1="12" y1="14" x2="38" y2="14" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="25" cy="56" r="3" fill="#dc2626"/>
    <line x1="12" y1="56" x2="38" y2="56" stroke="#dc2626" stroke-width="1.5"/>
  </g>

  <!-- Sparkle sparks -->
  <circle cx="22" cy="24" r="3" fill="#f97316"/>
  <circle cx="78" cy="26" r="3.5" fill="#facc15"/>
  <circle cx="82" cy="72" r="2.5" fill="#ef4444"/>
</svg>
