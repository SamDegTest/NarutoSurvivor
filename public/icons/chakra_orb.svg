<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="chakraCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="chakraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Radiant Aura -->
  <circle cx="50" cy="50" r="42" fill="#38bdf8" opacity="0.35" filter="url(#chakraGlow)"/>
  <circle cx="50" cy="50" r="34" fill="#0284c7" opacity="0.6"/>
  <!-- Glowing Core -->
  <circle cx="50" cy="50" r="26" fill="url(#chakraCore)" filter="url(#chakraGlow)"/>

  <!-- Swirling Vortex Spirals (Rasengan Chakra Flow) -->
  <path d="M50 24 A26 26 0 0 1 76 50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M50 76 A26 26 0 0 1 24 50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M50 32 A18 18 0 0 1 68 50" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 68 A18 18 0 0 1 32 50" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round"/>
  
  <circle cx="50" cy="50" r="8" fill="#ffffff" filter="url(#chakraGlow)"/>
</svg>
